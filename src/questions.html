<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/questions.css" />
    <link rel="stylesheet" href="./css/homepage.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css"
    />
    <script
      type="module"
      defer
      src="./js/views/homepage/headerView.js"
    ></script>
  </head>
  <body>
    <header-component></header-component>
    <main>
      <div class="slider">
        <div class="question">
          <div class="text">
            <h1>Which ripe drug is associated with drug-induced lupus?</h1>
          </div>
          <div class="options">
            <button class="learn-button">Ethambutol</button>
            <button>Pirazynamide</button>
            <button>Isolianid</button>
            <button>Rifampicin</button>
          </div>
        </div>
        <div class="arrow-left-container">
          <object
            type="image/svg+xml"
            data="./img/backArrow.svg"
            class="arrow left"
          >
            Your browser does not support SVG
          </object>
        </div>
        <div class="arrow-right-container">
          <object
            type="image/svg+xml"
            data="./img/backArrow.svg"
            class="arrow right"
          >
            Your browser does not support SVG
          </object>
        </div>
        <div class="dots">
          <button></button>
          <button></button>
          <button></button>
          <button></button>
          <button></button>
          <button></button>
          <button></button>
        </div>
      </div>
    </main>
  </body>
</html>
