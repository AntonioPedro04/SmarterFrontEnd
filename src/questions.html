<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./css/main.css" />
    <link rel="stylesheet" href="./css/questions.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.2.0/remixicon.min.css"
    />
    <script
      type="module"
      defer
      src="./js/views/homepage/headerView.js"
    ></script>
    <script
      type="module"
      defer
      src="./js/controllers/questionsController.js"
    ></script>
  </head>
  <body>
    <header-component></header-component>
    <main>
      <div class="slider">
        <div class="arrow-left-container">
          <img src="./img/backArrow.svg" alt="arrow left" class="arrow left" />
        </div>
        <div class="arrow-right-container">
          <img
            src="./img/backArrow.svg"
            alt="arrow right"
            class="arrow right"
          />
        </div>
        <div class="dots">
          <button class="dot active" id="dot-1"></button>
          <button class="dot" id="dot-2"></button>
          <button class="dot" id="dot-3"></button>
          <button class="dot" id="dot-4"></button>
          <button class="dot" id="dot-5"></button>
          <button class="dot" id="dot-6"></button>
          <button class="dot" id="dot-7"></button>
          <button class="dot" id="dot-8"></button>
          <button class="dot" id="dot-9"></button>
          <button class="dot" id="dot-10"></button>
        </div>
      </div>
    </main>
  </body>
</html>
